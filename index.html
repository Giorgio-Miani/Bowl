<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bowl</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c4562b">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bowl"><link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2b2420;--mu:#8a7d72;--ac:#c4562b;--ln:#eadfd2;--ch:#f1e6d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#27221f;--tx:#f1e9e0;--mu:#a09388;--ac:#e8794d;--ln:#3a332e;--ch:#352e29}}
:root[data-theme="dark"]{--bg:#1c1816;--card:#27221f;--tx:#f1e9e0;--mu:#a09388;--ac:#e8794d;--ln:#3a332e;--ch:#352e29}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font:700 26px Georgia,serif;margin:6px 0 12px}h2{font:700 17px Georgia,serif;margin:22px 0 8px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ch);cursor:pointer}
.pri{background:var(--ac);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;border-radius:99px;padding:6px 13px;background:var(--ch);font-size:14px}
.chip.on{background:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
.card b{font:700 18px Georgia,serif}.mu{color:var(--mu);font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 4px 14px #0004}
.wh .wb{display:none;position:fixed;inset:0;z-index:10;background:#0003}.wh.open .wb{display:block}
.wh .wd{position:fixed;bottom:0;z-index:11;pointer-events:none;transform:scale(0);transition:transform .25s ease}.wh.open .wd{transform:scale(1)}
.wh .wi{position:fixed;bottom:calc(47px + env(safe-area-inset-bottom,0px));z-index:12;white-space:nowrap;background:var(--card);border:1px solid var(--ln);box-shadow:0 4px 14px #0003;border-radius:99px;padding:12px 18px;opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s}.wh.open .wi{opacity:1;pointer-events:auto}
#wh .wd{right:0;width:260px;height:260px;background:radial-gradient(circle 260px at 100% 100%,var(--ch) 55%,transparent 100%);transform-origin:100% 100%}
#wh .wi{right:47px;transform:translate(50%,50%) scale(.4)}#wh.open .wi{transform:translate(calc(50% + var(--x)),calc(50% + var(--y))) scale(1)}
#bh .wd{left:0;width:300px;height:300px;background:radial-gradient(circle 300px at 0 100%,var(--ch) 55%,transparent 100%);transform-origin:0 100%}
#bh .wi{left:47px;transform:translate(-50%,50%) scale(.4)}#bh.open .wi{transform:translate(calc(-50% + var(--x)),calc(50% + var(--y))) scale(1)}
#fb,#bk{z-index:12;transition:transform .25s}#wh.open~#fb{transform:rotate(45deg)}#bk{right:auto;left:18px}#bk svg{display:block;margin:auto}
#dr .db{position:fixed;inset:0;z-index:40;background:#0004;opacity:0;pointer-events:none;transition:opacity .25s}#dr.open .db{opacity:1;pointer-events:auto}
#dr .dp{position:fixed;top:0;right:0;bottom:0;width:min(280px,80vw);z-index:41;background:var(--card);border-left:1px solid var(--ln);padding:calc(20px + env(safe-area-inset-top,0px)) 18px 18px;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;gap:10px;box-shadow:-6px 0 20px #0003;visibility:hidden}
#dr.open .dp{transform:none;visibility:visible}
.ic{padding:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;max-width:80%;font-size:14px;display:none}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row.top{align-items:flex-start}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.step{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.step img,.ph{width:100%;border-radius:10px;margin-top:8px;display:block}
.ing{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
.sv{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin:12px 0}
.sv button{width:40px;height:40px;font-size:22px;padding:0}.sv span{flex:1;text-align:center;font-weight:600}
.n{display:inline-block;background:var(--ac);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;font-size:14px;margin-right:6px}
.pre{white-space:pre-wrap}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let R=[],q='',cat='',cur=null,sv=2,d=null,delArm=false;
const CFG={apiKey:"AIzaSyClmQi2UWl7ALmpnuOWM8Wl_taJ2mUY7No",authDomain:"bowl-cfee8.firebaseapp.com",projectId:"bowl-cfee8",storageBucket:"bowl-cfee8.firebasestorage.app",messagingSenderId:"509132956687",appId:"1:509132956687:web:286af8881620f29f67af7a"};
let F=null,fdb=null,uid=null,unsub=null,started=false;const P=new Map();
async function initFb(){const B='https://www.gstatic.com/firebasejs/10.14.1/';
const [a,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
F={...a,...au,...fs};const app=F.initializeApp(CFG);
fdb=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});F.auth=F.getAuth(app);
F.onAuthStateChanged(F.auth,u=>{if(unsub)unsub();unsub=null;started=false;
if(!u){uid=null;R=[];return login()}
uid=u.uid;unsub=F.onSnapshot(F.collection(fdb,'users',uid,'recipes'),sn=>{R=sn.docs.map(x=>x.data());R.forEach(r=>P.set(r.id,new Set(r.steps.map(t=>t.pid).filter(Boolean))));
if(!started){started=true;home()}else if($('#list'))list()},e=>{$('#app').innerHTML='<p>Errore database: '+esc(e.code||e.message)+'</p><button onclick="logout()">Esci</button>'})})}
function login(m){$('#app').innerHTML=`<h1>Bowl</h1><p class="mu">Accedi per vedere le tue ricette.</p><p><button class="pri" onclick="signIn()">Accedi con Google</button></p><p class="mu" id="lm">${esc(m||'')}</p>`}
async function signIn(){try{await F.signInWithPopup(F.auth,new F.GoogleAuthProvider())}catch(e){$('#lm').textContent='Errore: '+(e.code||e.message)}}
function logout(){F.signOut(F.auth)}
const pdoc=id=>F.doc(fdb,'users',uid,'photos',id),rdoc=id=>F.doc(fdb,'users',uid,'recipes',id);
async function loadPhotos(r){await Promise.all(r.steps.map(async t=>{if(t.pid&&!t.p){try{const x=await F.getDoc(pdoc(t.pid));if(x.exists())t.p=x.data().d}catch(e){}}}))}
function save(r){const old=P.get(r.id)||new Set(),keep=new Set();
for(const t of r.steps){if(t.p&&!t.pid)t.pid=nid();if(t.pid){keep.add(t.pid);if(t.p&&!old.has(t.pid))F.setDoc(pdoc(t.pid),{d:t.p}).catch(console.error)}}
old.forEach(p=>{if(!keep.has(p))F.deleteDoc(pdoc(p)).catch(console.error)});
P.set(r.id,keep);F.setDoc(rdoc(r.id),{...r,steps:r.steps.map(t=>({t:t.t,pid:t.pid||''}))}).catch(console.error)}
function del(r){(P.get(r.id)||new Set()).forEach(p=>F.deleteDoc(pdoc(p)).catch(console.error));P.delete(r.id);F.deleteDoc(rdoc(r.id)).catch(console.error)}
const num=n=>(Math.round(n*100)/100).toLocaleString('it',{maximumFractionDigits:2});
const cats=()=>[...new Set(R.flatMap(r=>r.cats))].sort();
const hay=r=>[r.title,r.cats.join(' '),r.ing.map(i=>i.n).join(' '),r.steps.map(s=>s.t).join(' '),r.cons,r.extra.map(e=>e.t+' '+e.x).join(' ')].join(' ').toLowerCase();

function home(){if(window.pend)return location.reload();cur=null;
$('#app').innerHTML=`<div class="bar"><h1>Bowl</h1><button class="ic" onclick="drw()" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div><div id="dr"><div class="db" onclick="drw()"></div><aside class="dp"><div class="mu">Account</div><div style="word-break:break-all">${esc(F&&F.auth&&F.auth.currentUser?F.auth.currentUser.email||'':'')}</div><button id="ob" onclick="out()">Esci</button></aside></div><input id="q" type="search" placeholder="Cerca in titolo, ingredienti, procedimento…" value="${esc(q)}"><div class="chips" id="chips"></div><div id="list"></div><div class="wh" id="wh"><div class="wb" onclick="fab()"></div><div class="wd"></div><button class="wi" style="--x:-112px;--y:-48px" onclick="fab();fromText()">Bozza da testo</button><button class="wi" style="--x:-48px;--y:-112px" onclick="fab();edit()">Nuova bozza</button></div><button class="fab pri" id="fb" onclick="fab('wh')" aria-label="Aggiungi">+</button><div class="wh" id="bh"><div class="wb" onclick="fab()"></div><div class="wd"></div><button class="wi" style="--x:130px;--y:-44px" onclick="fab();exJ()">Completo (.json)</button><button class="wi" style="--x:95px;--y:-100px" onclick="fab();exX()">Leggibile (.xlsx)</button><button class="wi" style="--x:50px;--y:-156px" onclick="fab();backup()">Importa</button></div><button class="fab pri" id="bk" onclick="fab('bh')" aria-label="Backup"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></button>`;
$('#q').oninput=e=>{q=e.target.value;list()};list();scrollTo(0,0)}
function fab(id){['wh','bh'].forEach(k=>{const e=$('#'+k);if(!e)return;if(k===id)e.classList.toggle('open');else e.classList.remove('open')})}
let outArm=false;
function drw(){$('#dr').classList.toggle('open');outArm=false;$('#ob').textContent='Esci'}
function out(){if(!outArm){outArm=true;$('#ob').textContent='Tocca ancora per uscire';return}outArm=false;logout()}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000)}
function list(){
$('#chips').innerHTML=['',...cats()].map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${c?esc(c):'Tutte'}</button>`).join('');
$$('#chips button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;list()});
const w=q.toLowerCase().split(/\s+/).filter(Boolean);
const f=R.filter(r=>(!cat||r.cats.includes(cat))&&w.every(x=>hay(r).includes(x))).sort((a,b)=>a.title.localeCompare(b.title));
$('#list').innerHTML=f.length?f.map(r=>`<div class="card" data-id="${r.id}"><b>${esc(r.title)}</b><div class="mu">${r.cats.map(esc).join(' · ')||'Senza categoria'} · ${r.ing.length} ingredienti</div></div>`).join(''):`<p class="mu">${R.length?'Nessuna ricetta trovata.':'Nessuna ricetta ancora. Tocca + per aggiungerne una.'}</p>`;
$$('.card').forEach(c=>c.onclick=()=>show(c.dataset.id))}

function show(id){cur=R.find(r=>r.id===id);if(!cur)return home();sv=cur.base;delArm=false;drawShow();const c=cur;loadPhotos(c).then(()=>{if(cur===c)drawShow()})}
function drawShow(){const r=cur,k=sv/r.base;
$('#app').innerHTML=`<div class="bar"><button onclick="home()">← Indietro</button><button onclick="edit('${r.id}')">Modifica</button></div>
<h1>${esc(r.title)}</h1><div>${r.cats.map(c=>`<span class="chip">${esc(c)}</span> `).join('')}</div>
<h2>Ingredienti</h2><div class="sv"><button onclick="sv=Math.max(1,sv-1);drawShow()">−</button><span>${sv} ${sv===1?'porzione':'porzioni'}</span><button onclick="sv++;drawShow()">+</button></div>
${r.ing.map(i=>`<div class="ing"><span>${esc(i.n)}</span><b>${i.q!==''&&!isNaN(i.q)?num(i.q*k):''} ${esc(i.u)}</b></div>`).join('')}
<h2>Procedimento</h2>${r.steps.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><span class="pre">${esc(s.t)}</span>${s.p?`<img src="${s.p}" alt="">`:''}</div>`).join('')}
${r.cons?`<h2>Conservazione</h2><div class="pre">${esc(r.cons)}</div>`:''}
${r.extra.map(e=>`<h2>${esc(e.t)}</h2><div class="pre">${esc(e.x)}</div>`).join('')}
<p style="margin-top:30px"><button onclick="rm()">${delArm?'Tocca ancora per eliminare':'Elimina ricetta'}</button></p>`}
function rm(){if(!delArm){delArm=true;return drawShow()}const r=cur;R=R.filter(x=>x.id!==r.id);del(r);home()}

async function edit(id){const r=R.find(x=>x.id===id);if(r)await loadPhotos(r);
d=r?JSON.parse(JSON.stringify(r)):{id:'r'+Date.now(),title:'',cats:[],base:2,ing:[{q:'',u:'',n:''}],steps:[{t:'',p:''}],cons:'',extra:[]};drawEdit()}
function sync(){d.title=$('#t').value.trim();d.cats=$('#c').value.split(',').map(s=>s.trim()).filter(Boolean);d.base=Math.max(1,parseInt($('#b').value)||2);
d.ing=$$('.ir').map(r=>({q:r.children[0].value.replace(',','.'),u:r.children[1].value.trim(),n:r.children[2].value.trim()}));
$$('.st textarea').forEach((t,i)=>d.steps[i].t=t.value);d.cons=$('#cons').value;
$$('.ex').forEach((e,i)=>{d.extra[i].t=e.children[0].value;d.extra[i].x=e.children[1].value})}
function drawEdit(){
$('#app').innerHTML=`<div class="bar"><button onclick="d.title?show(d.id)||0:home()">Annulla</button><button class="pri" onclick="done()">Salva</button></div>
<h1>${R.some(r=>r.id===d.id)?'Modifica':'Nuova ricetta'}</h1>
<input id="t" placeholder="Titolo" value="${esc(d.title)}">
<h2>Categorie</h2><input id="c" placeholder="es. dolce, salato, aperitivo" value="${esc(d.cats.join(', '))}">
<div class="chips">${cats().map(c=>`<button class="chip" onclick="addCat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('')}</div>
<h2>Ingredienti</h2><div class="row"><span>Quantità per</span><input id="b" type="number" min="1" style="width:70px" value="${d.base}"><span>porzioni</span></div>
${d.ing.map((i,x)=>`<div class="row ir"><input inputmode="decimal" placeholder="Qtà" style="width:68px" value="${esc(i.q)}"><input placeholder="Unità" style="width:78px" value="${esc(i.u)}"><input placeholder="Ingrediente" value="${esc(i.n)}"><button onclick="sync();d.ing.splice(${x},1);drawEdit()">×</button></div>`).join('')}
<button onclick="sync();d.ing.push({q:'',u:'',n:''});drawEdit()">+ Ingrediente</button>
<h2>Passaggi</h2>${d.steps.map((s,x)=>`<div class="step st"><div class="bar"><b>Passo ${x+1}</b><button onclick="sync();d.steps.splice(${x},1);drawEdit()">×</button></div><textarea placeholder="Descrivi il passaggio…">${esc(s.t)}</textarea>${s.p?`<img src="${s.p}" alt=""><button style="margin-top:8px" onclick="sync();d.steps[${x}].p='';d.steps[${x}].pid='';drawEdit()">Rimuovi foto</button>`:`<label class="chip" style="display:inline-block;margin-top:8px">Aggiungi foto<input type="file" accept="image/*" hidden onchange="photo(this,${x})"></label>`}</div>`).join('')}
<button onclick="sync();d.steps.push({t:'',p:''});drawEdit()">+ Passaggio</button>
<h2>Conservazione</h2><textarea id="cons" placeholder="Come e per quanto si conserva…">${esc(d.cons)}</textarea>
<h2>Altre sezioni</h2>${d.extra.map((e,x)=>`<div class="step ex"><input placeholder="Titolo (es. Consigli, Varianti)" value="${esc(e.t)}" style="margin-bottom:8px"><textarea>${esc(e.x)}</textarea><button style="margin-top:8px" onclick="sync();d.extra.splice(${x},1);drawEdit()">Rimuovi sezione</button></div>`).join('')}
<button onclick="sync();d.extra.push({t:'',x:''});drawEdit()">+ Sezione extra</button>`;scrollTo(0,0)}
function addCat(c){const i=$('#c'),a=i.value.split(',').map(s=>s.trim()).filter(Boolean);if(!a.includes(c))a.push(c);i.value=a.join(', ')}
function photo(inp,x){const f=inp.files[0];if(!f)return;sync();const im=new Image(),u=URL.createObjectURL(f);
im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);d.steps[x].p=c.toDataURL('image/jpeg',.75);d.steps[x].pid=nid();URL.revokeObjectURL(u);drawEdit()};im.src=u}
async function done(){sync();if(!d.title){alert('Inserisci un titolo');return}
d.ing=d.ing.filter(i=>i.n||i.q);d.steps=d.steps.filter(s=>s.t||s.p||s.pid);d.extra=d.extra.filter(e=>e.t||e.x);
const i=R.findIndex(r=>r.id===d.id);i<0?R.push(d):R[i]=d;save(d);show(d.id)}
const FR={'½':.5,'¼':.25,'¾':.75};
const H=[[/^ingredienti/i,'i'],[/^(procedimento|preparazione|come si prepara|come si fa|istruzioni|metodo|esecuzione)/i,'s'],[/^(conservazione|come conservare)/i,'c'],[/^(consigli|consiglio|suggerimenti|note|nota|varianti|trucchetto)/i,'x']];
function pIng(l,force){let m;
if((m=l.match(/^(\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾])\s*(kg|g|gr|grammi|ml|l|lt|litri?|cl|dl|cucchiai[oa]?|cucchiaini?|tazz[ae]|bicchier[ei]|pizzic[oi]|spicch[io]|fett[ae])?\b\s*(?:di\s+|d')?(.+)$/i))&&!/^(minut|or[ae]\b|second|gradi|°|[-–]\d)/i.test(m[3])){
let q=m[1];q=FR[q]!==undefined?FR[q]:q.includes('/')?+(q.split('/')[0]/q.split('/')[1]).toFixed(2):q.replace(',','.');
let u=(m[2]||'').toLowerCase();u={gr:'g',grammi:'g',lt:'l',litri:'l',litro:'l'}[u]||u;return{q:String(q),u,n:m[3].trim()}}
if((m=l.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(kg|g|gr|ml|l|lt|cl)$/i)))return{q:m[2].replace(',','.'),u:{gr:'g',lt:'l'}[m[3].toLowerCase()]||m[3].toLowerCase(),n:m[1]};
if(/(\bq\.?\s?b\.?|quanto basta)$/i.test(l)||force)return{q:'',u:'',n:l};return null}
function parseRec(raw){
let L=raw.replace(/\r/g,'').replace(/(\d)\uFE0F?\u20E3/g,'$1. ').replace(/#[\p{L}\p{N}_]+/gu,'').replace(/@[\w.]+/g,'').split('\n')
.map(l=>l.replace(/[\p{Extended_Pictographic}\uFE0F\u200d\u20E3]/gu,'').replace(/^[\s\-•*·–—▪]+/,'').replace(/\s+/g,' ').trim()).filter(Boolean);
const isH=l=>l.length<60&&H.find(h=>h[0].test(l));
let title='';if(L.length&&L[0].length<=70&&!isH(L[0])&&!pIng(L[0])&&!/^\d+[.)]\s/.test(L[0]))title=L.shift().replace(/[!:.\s]+$/,'');
let sec='',ing=[],st=[],cons=[],ex=[],intro=[],base=2,cx=null;
const step=l=>st.push(l.replace(/^(\d+[.)]|step\s*\d+[:.)]?)\s*/i,''));
for(const l of L){const h=isH(l),b=l.match(/\b(\d+)\s*(persone|porzioni|pers)\b/i);
if(h){sec=h[1];let rest=l.replace(h[0],'').replace(/^[a-zà-ù]*/i,m=>sec==='x'||sec==='s'||sec==='i'||sec==='c'?'':m).replace(/^[\s:–-]+/,'');
if(b){base=+b[1];rest='';}
if(sec==='x'){cx={t:l.match(h[0])[0].replace(/^./,c=>c.toUpperCase()),x:[]};ex.push(cx)}
if(rest){if(sec==='c')cons.push(rest);else if(sec==='x')cx.x.push(rest);else if(sec==='s')step(rest);else if(sec==='i')ing.push(pIng(rest,1))}continue}
if(b&&l.length<45&&!pIng(l)){base=+b[1];continue}
if(sec==='i'){ing.push(pIng(l,1));continue}
if(sec==='s'){step(l);continue}
if(sec==='c'){cons.push(l);continue}
if(sec==='x'){cx.x.push(l);continue}
if(/^(\d+[.)]|step\s*\d+)\s*/i.test(l)&&/^(\d+[.)]|step\s*\d+)\s+\S/i.test(l)){step(l);continue}
const p=pIng(l);if(p){ing.push(p);continue}
if(ing.length||st.length)step(l);else intro.push(l)}
if(st.length===1&&st[0].length>220)st=st[0].match(/[^.!?]+[.!?]*/g).map(s=>s.trim()).filter(Boolean);
const extra=ex.filter(e=>e.x.length).map(e=>({t:e.t,x:e.x.join('\n')}));if(intro.length)extra.push({t:'Note',x:intro.join('\n')});
return{id:'r'+Date.now(),title,cats:[],base,ing:ing.length?ing:[{q:'',u:'',n:''}],steps:(st.length?st:['']).map(t=>({t,p:''})),cons:cons.join('\n'),extra}}

function fromText(){cur=null;$('#app').innerHTML=`<div class="bar"><button onclick="home()">← Indietro</button><button class="pri" onclick="mk()">Crea bozza</button></div><h1>Da testo</h1><p class="mu">Incolla il testo della ricetta (ad esempio la descrizione di un post). Creo una bozza che potrai correggere prima di salvare.</p><textarea id="tx" style="min-height:280px" placeholder="Incolla qui…"></textarea>`}
function mk(){const t=$('#tx').value.trim();if(!t)return;d=parseRec(t);drawEdit()}
let DL=null;
function backup(){$('#app').innerHTML=`<div class="bar"><button onclick="home()">← Indietro</button></div><h1>Backup</h1><p class="mu">${R.length} ricette salvate.</p>
<h2>Esporta</h2><p><button class="pri" onclick="exJ()">Completo (.json, con foto)</button></p><p><button onclick="exX()">Leggibile (.xlsx, senza foto)</button></p>
<h2>Importa</h2><p class="mu">Le ricette con lo stesso titolo vengono sostituite, le altre aggiunte.</p><label class="chip" style="display:inline-block">Scegli file .json o .xlsx<input type="file" accept=".json,.xlsx" hidden onchange="imp(this)"></label><p id="msg"></p>`}
const msg=t=>{const e=$('#msg');e?e.textContent=t:toast(t)},today=()=>new Date().toISOString().slice(0,10);
async function dl(name,data){try{if(DL)await DL.save({filename:name,data});else{const u=URL.createObjectURL(new Blob([data])),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}msg('Fatto')}catch(e){msg(e.code==='declined'?'Annullato.':'Errore: '+(e.message||e.code))}}
async function exJ(){msg('Preparo il file…');for(const r of R)await loadPhotos(r);dl(`ricettario-${today()}.json`,JSON.stringify({v:1,recipes:R.map(r=>({...r,steps:r.steps.map(t=>({t:t.t,p:t.p||''}))}))}))}
function exX(){const rows=R.map(r=>({Titolo:r.title,Categorie:r.cats.join(', '),Porzioni:r.base,Ingredienti:r.ing.map(i=>[i.q,i.u,i.n].join(' | ')).join('\n'),Procedimento:r.steps.map((s,i)=>(i+1)+'. '+s.t).join('\n'),Conservazione:r.cons,Extra:r.extra.map(e=>e.t+': '+e.x).join('\n\n')}));
const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:28},{wch:20},{wch:9},{wch:40},{wch:70},{wch:35},{wch:40}];
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ricette');dl(`ricettario-${today()}.xlsx`,XLSX.write(wb,{type:'array',bookType:'xlsx'}))}
const nid=()=>'r'+Date.now()+Math.random().toString(36).slice(2,6);
async function imp(inp){const f=inp.files[0];if(!f)return;try{let L;
if(/\.xlsx$/i.test(f.name)){const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
L=rows.filter(x=>x.Titolo).map(x=>({id:nid(),title:String(x.Titolo).trim(),cats:String(x.Categorie||'').split(',').map(s=>s.trim()).filter(Boolean),base:parseInt(x.Porzioni)||2,
ing:String(x.Ingredienti||'').split('\n').filter(l=>l.trim()).map(l=>{const p=l.split('|').map(s=>s.trim());return p.length>=3?{q:p[0],u:p[1],n:p.slice(2).join(' | ')}:{q:'',u:'',n:l.trim()}}),
steps:String(x.Procedimento||'').split(/\n(?=\d+\.\s)/).filter(s=>s.trim()).map(s=>({t:s.replace(/^\d+\.\s*/,'').trim(),p:''})),cons:String(x.Conservazione||''),
extra:String(x.Extra||'').split(/\n\n+/).filter(s=>s.trim()).map(s=>{const k=s.indexOf(':');return k<0?{t:'Note',x:s}:{t:s.slice(0,k).trim(),x:s.slice(k+1).trim()}})}))}
else L=JSON.parse(await f.text()).recipes;
if(!Array.isArray(L)||!L.length)return msg('Nessuna ricetta trovata nel file.');
let n=0;for(const r of L){if(!r.title||!Array.isArray(r.ing)||!Array.isArray(r.steps))continue;r.cats=r.cats||[];r.extra=r.extra||[];r.cons=r.cons||'';r.base=r.base||2;
const i=R.findIndex(x=>x.title.toLowerCase()===r.title.toLowerCase());
if(i>=0){await loadPhotos(R[i]);r.id=R[i].id;if(R[i].steps.length===r.steps.length)r.steps.forEach((s,k)=>{if(!s.p)s.p=R[i].steps[k].p||''});R[i]=r}else{if(R.some(x=>x.id===r.id))r.id=nid();R.push(r)}
save(r);n++}
msg(n+' ricette importate')}catch(e){msg('File non valido.')}inp.value=''}

addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(g=>document.addEventListener('visibilitychange',()=>{if(!document.hidden)g.update().catch(()=>{})})).catch(()=>{}))}
